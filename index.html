<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="VÉLOR Mobility Studio — protótipo conceitual Or7.dev de uma locadora de veículos: frota, comparador e simulador de locação."
    />
    <meta name="theme-color" content="#0B0D10" />
    <title>VÉLOR — Mobility Studio</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1485291571150-772bcfc10da5?auto=format&fit=crop&w=1600&q=70"
      imagesrcset="https://images.unsplash.com/photo-1485291571150-772bcfc10da5?auto=format&fit=crop&w=800&q=70 800w, https://images.unsplash.com/photo-1485291571150-772bcfc10da5?auto=format&fit=crop&w=1600&q=70 1600w, https://images.unsplash.com/photo-1485291571150-772bcfc10da5?auto=format&fit=crop&w=2400&q=70 2400w"
      imagesizes="(min-width: 1024px) 80vw, 170vw"
      fetchpriority="high"
    />
    <script>
      // Aplica o tema salvo antes da pintura para evitar flash.
      try {
        var t = localStorage.getItem('velor:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        else if (window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este protótipo precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
